<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Kanban Workflow Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
        }
        .bottleneck-alert {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { border-color: #ef4444; box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="bg-[#0f172a] text-white p-6 shadow-md shrink-0">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-indigo-400 text-3xl">dynamic_feeds</span>
                    <h1 class="text-2xl font-black tracking-tight">PipelineSim<span class="text-indigo-400">.</span></h1>
                </div>
                <p class="text-xs text-slate-400 mt-1">Simulate assembly line mechanics, WIP limits, and pipeline flow dynamics.</p>
            </div>
            
            <div class="flex items-center gap-4 bg-slate-800 p-3 rounded-xl border border-slate-700">
                <div class="text-center px-3 border-r border-slate-700">
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Active Bottlenecks</p>
                    <p id="metric-bottlenecks" class="text-xl font-black text-emerald-400">0</p>
                </div>
                <div class="text-center px-3 border-r border-slate-700">
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Total In-Flight</p>
                    <p id="metric-inflight" class="text-xl font-black text-indigo-400">0</p>
                </div>
                <div class="text-center px-3">
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Throughput (Done)</p>
                    <p id="metric-done" class="text-xl font-black text-amber-400">0</p>
                </div>
            </div>
        </div>
    </header>

    <section class="max-w-7xl w-full mx-auto p-6 shrink-0">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center gap-4">
            <div class="flex-1 w-full">
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Create New Work Item</label>
                <div class="flex gap-2">
                    <input type="text" id="task-title-input" placeholder="e.g., Optimize Database Architecture..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition">
                    <select id="task-priority-input" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none font-semibold text-slate-600">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                </div>
            </div>
            <button onclick="addNewTask()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-6 py-3 rounded-xl transition flex items-center justify-center self-end shadow-md shadow-indigo-100 h-[42px]">
                <span class="material-symbols-outlined mr-2 text-sm">add_circle</span> Inject Into Backlog
            </button>
        </div>
    </section>

    <main class="flex-1 overflow-x-auto p-6 pt-0">
        <div class="max-w-7xl mx-auto h-full grid grid-cols-1 md:grid-cols-5 gap-4 items-start min-w-[1000px]">
            
            <div id="col-backlog" class="bg-slate-100 rounded-2xl border border-slate-200 p-4 flex flex-col max-h-[70vh]">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-slate-400 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">Backlog</h3>
                    </div>
                    <span id="count-backlog" class="bg-slate-200 text-slate-600 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="cards-backlog" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

            <div id="col-todo" class="bg-slate-100 rounded-2xl border border-slate-200 p-4 flex flex-col max-h-[70vh]">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-sky-500 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">To Do</h3>
                    </div>
                    <span id="count-todo" class="bg-slate-200 text-slate-600 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="cards-todo" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

            <div id="col-in_progress" class="bg-slate-100 rounded-2xl border-2 border-transparent p-4 flex flex-col max-h-[70vh] transition-all">
                <div class="flex justify-between items-center mb-1">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-indigo-500 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">In Progress</h3>
                    </div>
                    <span id="count-in_progress" class="bg-indigo-100 text-indigo-700 font-bold text-xs px-2 py-0.5 rounded-full">0 / 3</span>
                </div>
                <p class="text-[10px] text-slate-400 font-semibold mb-3">WIP Limit: 3 Items</p>
                <div id="cards-in_progress" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

            <div id="col-review" class="bg-slate-100 rounded-2xl border-2 border-transparent p-4 flex flex-col max-h-[70vh] transition-all">
                <div class="flex justify-between items-center mb-1">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-purple-500 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">Review</h3>
                    </div>
                    <span id="count-review" class="bg-purple-100 text-purple-700 font-bold text-xs px-2 py-0.5 rounded-full">0 / 2</span>
                </div>
                <p class="text-[10px] text-slate-400 font-semibold mb-3">WIP Limit: 2 Items</p>
                <div id="cards-review" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

            <div id="col-done" class="bg-slate-100 rounded-2xl border border-slate-200 p-4 flex flex-col max-h-[70vh]">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">Done</h3>
                    </div>
                    <span id="count-done" class="bg-emerald-100 text-emerald-700 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="cards-done" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

        </div>
    </main>

    <script>
        // Pipeline Stage Configuration Definition
        const STAGES = ['backlog', 'todo', 'in_progress', 'review', 'done'];
        
        // Strict Work-In-Progress (WIP) parameters to calculate bottlenecks
        const WIP_LIMITS = {
            in_progress: 3,
            review: 2
        };

        // State Store containing initial layout cards to demonstrate immediate assembly flow
        let tasks = [
            { id: 1, title: "Draft high-fidelity marketing wireframes", stage: "backlog", priority: "Low" },
            { id: 2, title: "Refactor database index patterns", stage: "todo", priority: "High" },
            { id: 3, title: "Write unified authentication API engine", stage: "in_progress", priority: "High" },
            { id: 4, title: "Patch edge-case login timeout loophole", stage: "in_progress", priority: "Medium" },
            { id: 5, title: "Audit localized accessibility styling configs", stage: "review", priority: "Low" }
        ];

        // --- PIPELINE MANIPULATION ENGINES ---
        
        function renderPipeline() {
            // Setup blank canvas dictionaries for each separate block segment
            const containers = {};
            const counters = {};
            let activeBottlenecksCount = 0;

            STAGES.forEach(stage => {
                containers[stage] = document.getElementById(`cards-${stage}`);
                containers[stage].innerHTML = ''; // Sanitize old DOM objects
                counters[stage] = 0;
            });

            // Iterate state arrays and inject modular component code
            tasks.forEach(task => {
                counters[task.stage]++;
                
                // Assign matching style badges based on selected state priority tags
                let badgeColor = "bg-slate-100 text-slate-600";
                if(task.priority === 'Medium') badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(task.priority === 'High') badgeColor = "bg-rose-50 text-rose-700 border-rose-200";

                const currentStageIndex = STAGES.indexOf(task.stage);

                // Build action button configurations based on location rules inside array indices
                const showLeftButton = currentStageIndex > 0;
                const showRightButton = currentStageIndex < STAGES.length - 1;

                containers[task.stage].innerHTML += `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm transition hover:shadow-md flex flex-col gap-3">
                        <div>
                            <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded border ${badgeColor}">${task.priority} Priority</span>
                            <h4 class="text-sm font-bold text-slate-800 mt-2 leading-snug">${task.title}</h4>
                        </div>
                        <div class="flex items-center justify-between border-t border-slate-100 pt-3 mt-1">
                            <button onclick="purgeTask(${task.id})" class="text-slate-400 hover:text-rose-500 transition flex items-center">
                                <span class="material-symbols-outlined text-lg">delete</span>
                            </button>
                            <div class="flex gap-1">
                                ${showLeftButton ? `
                                    <button onclick="shiftTask(${task.id}, -1)" class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-1.5 rounded-lg transition flex items-center">
                                        <span class="material-symbols-outlined text-sm font-bold">arrow_back</span>
                                    </button>
                                ` : ''}
                                ${showRightButton ? `
                                    <button onclick="shiftTask(${task.id}, 1)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 p-1.5 rounded-lg transition flex items-center">
                                        <span class="material-symbols-outlined text-sm font-bold">arrow_forward</span>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            // Update Counter metrics and audit columns for active bottlenecks
            STAGES.forEach(stage => {
                const countLabel = document.getElementById(`count-${stage}`);
                const columnWrapper = document.getElementById(`col-${stage}`);
                
                if (WIP_LIMITS[stage]) {
                    countLabel.innerText = `${counters[stage]} / ${WIP_LIMITS[stage]}`;
                    
                    // BOTTLENECK RULE CHECK ENGINE: 
                    // Highlighting occurs when the column volume surpasses defined structural WIP constraints.
                    if (counters[stage] > WIP_LIMITS[stage]) {
                        columnWrapper.classList.remove('bg-slate-100', 'border-transparent');
                        columnWrapper.classList.add('bg-rose-50', 'border-rose-300', 'bottleneck-alert');
                        activeBottlenecksCount++;
                    } else {
                        columnWrapper.classList.remove('bg-rose-50', 'border-rose-300', 'bottleneck-alert');
                        columnWrapper.classList.add('bg-slate-100', 'border-transparent');
                    }
                } else {
                    countLabel.innerText = counters[stage];
                }
            });

            // Render live analytics metrics at top bar header display components
            document.getElementById('metric-bottlenecks').innerText = activeBottlenecksCount;
            document.getElementById('metric-inflight').innerText = tasks.filter(t => t.stage !== 'done').length;
            document.getElementById('metric-done').innerText = counters['done'];
        }

        // Action routing to systematically push items across arrays left or right
        function shiftTask(taskId, directionalShift) {
            const indexTarget = tasks.findIndex(t => t.id === taskId);
            if (indexTarget !== -1) {
                const currentStageIndex = STAGES.indexOf(tasks[indexTarget].stage);
                const completeNewTargetIndex = currentStageIndex + directionalShift;
                
                if (completeNewTargetIndex >= 0 && completeNewTargetIndex < STAGES.length) {
                    tasks[indexTarget].stage = STAGES[completeNewTargetIndex];
                    renderPipeline();
                }
            }
        }

        // Push new record entries inside structural array schemas
        function addNewTask() {
            const inputElement = document.getElementById('task-title-input');
            const priorityElement = document.getElementById('task-priority-input');

            if (!inputElement.value.trim()) return alert("Please clarify a target work-item title descriptor!");

            const payloadTask = {
                id: Date.now(), // Unique timeline identifier mapping index entries
                title: inputElement.value.trim(),
                stage: 'backlog',
                priority: priorityElement.value
            };

            tasks.push(payloadTask);
            inputElement.value = ''; // Flush target entry UI states
            renderPipeline();
        }

        // Remove item out of live runtime pipeline architectures completely
        function purgeTask(taskId) {
            tasks = tasks.filter(t => t.id !== taskId);
            renderPipeline();
        }

        // Initialize target UI structures instantly on document mount routine steps
        document.addEventListener('DOMContentLoaded', renderPipeline);
    </script>
</body>
</html>

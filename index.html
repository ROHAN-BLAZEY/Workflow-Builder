<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Kanban Workflow Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
        }
        .bottleneck-alert {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { border-color: #ef4444; box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="bg-[#0f172a] text-white p-6 shadow-md shrink-0">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-indigo-400 text-3xl">dynamic_feeds</span>
                    <h1 class="text-2xl font-black tracking-tight">PipelineSim<span class="text-indigo-400">.</span></h1>
                </div>
                <p class="text-xs text-slate-400 mt-1">Simulate assembly line mechanics, task limits, and pipeline flow dynamics.</p>
            </div>
            
            <div class="flex items-center gap-4 bg-slate-800 p-3 rounded-xl border border-slate-700">
                <div class="text-center px-3 border-r border-slate-700">
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Active Bottlenecks</p>
                    <p id="metric-bottlenecks" class="text-xl font-black text-emerald-400">0</p>
                </div>
                <div class="text-center px-3 border-r border-slate-700">
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Total In-Flight</p>
                    <p id="metric-inflight" class="text-xl font-black text-indigo-400">0</p>
                </div>
                <div class="text-center px-3">
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Throughput (Done)</p>
                    <p id="metric-done" class="text-xl font-black text-amber-400">0</p>
                </div>
            </div>
        </div>
    </header>

    <section class="max-w-7xl w-full mx-auto p-6 shrink-0">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center gap-4">
            <div class="flex-1 w-full">
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Create New Work Item</label>
                <div class="flex gap-2">
                    <input type="text" id="task-title-input" placeholder="e.g., Optimize Database Architecture..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition">
                    <select id="task-priority-input" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none font-semibold text-slate-600">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                </div>
            </div>
            <button onclick="addNewTask()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-6 py-3 rounded-xl transition flex items-center justify-center self-end shadow-md shadow-indigo-100 h-[42px]">
                <span class="material-symbols-outlined mr-2 text-sm">add_circle</span> Inject Into Backlog
            </button>
        </div>
    </section>

    <main class="flex-1 overflow-x-auto p-6 pt-0">
        <div class="max-w-7xl mx-auto h-full grid grid-cols-1 md:grid-cols-5 gap-4 items-start min-w-[1000px]">
            
            <div id="col-backlog" class="bg-slate-100 rounded-2xl border border-slate-200 p-4 flex flex-col max-h-[70vh]">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-slate-400 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">Backlog</h3>
                    </div>
                    <span id="count-backlog" class="bg-slate-200 text-slate-600 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="cards-backlog" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

            <div id="col-todo" class="bg-slate-100 rounded-2xl border border-slate-200 p-4 flex flex-col max-h-[70vh]">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-sky-500 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">To Do</h3>
                    </div>
                    <span id="count-todo" class="bg-slate-200 text-slate-600 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="cards-todo" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

            <div id="col-in_progress" class="bg-slate-100 rounded-2xl border-2 border-transparent p-4 flex flex-col max-h-[70vh] transition-all">
                <div class="flex justify-between items-center mb-1">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-indigo-500 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">In Progress</h3>
                    </div>
                    <span id="count-in_progress" class="bg-indigo-100 text-indigo-700 font-bold text-xs px-2 py-0.5 rounded-full">0 / 4</span>
                </div>
                <p class="text-[10px] text-slate-400 font-semibold mb-3">Limit: 4 Items</p>
                <div id="cards-in_progress" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

            <div id="col-review" class="bg-slate-100 rounded-2xl border-2 border-transparent p-4 flex flex-col max-h-[70vh] transition-all">
                <div class="flex justify-between items-center mb-1">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-purple-500 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">Review</h3>
                    </div>
                    <span id="count-review" class="bg-purple-100 text-purple-700 font-bold text-xs px-2 py-0.5 rounded-full">0 / 3</span>
                </div>
                <p class="text-[10px] text-slate-400 font-semibold mb-3">Limit: 3 Items</p>
                <div id="cards-review" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

            <div id="col-done" class="bg-slate-100 rounded-2xl border border-slate-200 p-4 flex flex-col max-h-[70vh]">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>
                        <h3 class="font-extrabold text-slate-700 text-sm uppercase tracking-wide">Done</h3>
                    </div>
                    <span id="count-done" class="bg-slate-200 text-slate-600 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="cards-done" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
            </div>

        </div>
    </main>

    <!-- UPDATED JAVASCRIPT: Connects to FastAPI Backend -->
    <script>
        // API Base URL (Change port if your FastAPI runs elsewhere)
        const API_URL = "http://127.0.0.1:8000/api/tasks";

        // Global State
        let tasks = [];
        const limits = { in_progress: 4, review: 3 };
        const stages = ['backlog', 'todo', 'in_progress', 'review', 'done'];

        // --- 1. Fetch Tasks from Python Backend ---
        async function fetchTasks() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Failed to fetch tasks");
                tasks = await response.json();
                renderBoard();
            } catch (error) {
                console.error("API Error:", error);
            }
        }

        // --- 2. Add New Task via API ---
        async function addNewTask() {
            const titleInput = document.getElementById('task-title-input');
            const priorityInput = document.getElementById('task-priority-input');

            if (!titleInput.value.trim()) return alert("Please specify a work item title descriptor.");

            const payload = {
                title: titleInput.value.trim(),
                priority: priorityInput.value
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    titleInput.value = ''; // Clear input
                    fetchTasks(); // Refresh board
                }
            } catch (error) {
                console.error("Error creating task:", error);
            }
        }

        // --- 3. Move Task (Update Stage) via API ---
        async function moveTask(id, direction) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            const currentIdx = stages.indexOf(task.stage);
            const targetIdx = currentIdx + direction;

            if (targetIdx >= 0 && targetIdx < stages.length) {
                const targetStage = stages[targetIdx];

                // Enforce WIP Limits
                if (direction > 0 && limits[targetStage]) {
                    const targetCount = tasks.filter(t => t.stage === targetStage).length;
                    if (targetCount >= limits[targetStage]) {
                        return alert(`Pipeline Stalled! '${targetStage}' is at full capacity (${limits[targetStage]} items).`);
                    }
                }

                // Call Backend PUT
                try {
                    await fetch(`${API_URL}/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ stage: targetStage })
                    });
                    fetchTasks(); // Refresh state from server
                } catch (error) {
                    console.error("Error updating task:", error);
                }
            }
        }

        // --- 4. Delete Task via API ---
        async function deleteTask(id) {
            try {
                await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                fetchTasks();
            } catch (error) {
                console.error("Error deleting task:", error);
            }
        }

        // --- 5. Render Logic (Same as before, visual only) ---
        function renderBoard() {
            stages.forEach(stage => {
                const container = document.getElementById(`cards-${stage}`);
                container.innerHTML = '';
                
                const stageTasks = tasks.filter(t => t.stage === stage);
                
                // Update counts & Visual Bottleneck Alerts
                if (limits[stage]) {
                    document.getElementById(`count-${stage}`).innerText = `${stageTasks.length} / ${limits[stage]}`;
                    const columnElement = document.getElementById(`col-${stage}`);
                    if (stageTasks.length >= limits[stage]) {
                        columnElement.classList.add('border-red-400', 'bg-red-50/30', 'bottleneck-alert');
                    } else {
                        columnElement.classList.remove('border-red-400', 'bg-red-50/30', 'bottleneck-alert');
                    }
                } else {
                    document.getElementById(`count-${stage}`).innerText = stageTasks.length;
                }

                // Render Cards
                stageTasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition group flex flex-col gap-2.5 relative";
                    
                    let priorityColor = "bg-slate-100 text-slate-600";
                    if (task.priority === "High") priorityColor = "bg-red-50 text-red-600 border border-red-100";
                    if (task.priority === "Medium") priorityColor = "bg-amber-50 text-amber-600 border border-amber-100";

                    const currentIdx = stages.indexOf(stage);

                    card.innerHTML = `
                        <div class="flex justify-between items-start gap-2">
                            <span class="text-2xs font-extrabold uppercase px-2 py-0.5 rounded ${priorityColor}">${task.priority}</span>
                            <button onclick="deleteTask(${task.id})" class="text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition absolute top-3.5 right-3.5">
                                <span class="material-symbols-outlined text-sm">delete</span>
                            </button>
                        </div>
                        <p class="text-sm font-semibold tracking-tight text-slate-700 pr-4 leading-tight">${task.title}</p>
                        <div class="flex justify-between mt-1 pt-2 border-t border-slate-50">
                            <button onclick="moveTask(${task.id}, -1)" ${currentIdx === 0 ? 'disabled' : ''} class="text-slate-400 hover:text-indigo-600 disabled:opacity-20 flex items-center justify-center p-1 rounded hover:bg-slate-50">
                                <span class="material-symbols-outlined text-md">arrow_back</span>
                            </button>
                            <button onclick="moveTask(${task.id}, 1)" ${currentIdx === stages.length - 1 ? 'disabled' : ''} class="text-slate-400 hover:text-indigo-600 disabled:opacity-20 flex items-center justify-center p-1 rounded hover:bg-slate-50">
                                <span class="material-symbols-outlined text-md">arrow_forward</span>
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
            calculateMetrics();
        }

        function calculateMetrics() {
            const bottlenecks = stages.filter(stage => limits[stage] && tasks.filter(t => t.stage === stage).length >= limits[stage]).length;
            const inflight = tasks.filter(t => t.stage !== 'done').length;
            const done = tasks.filter(t => t.stage === 'done').length;

            document.getElementById('metric-bottlenecks').innerText = bottlenecks;
            document.getElementById('metric-inflight').innerText = inflight;
            document.getElementById('metric-done').innerText = done;
        }

        // Initial Load
        fetchTasks();
    </script>
</body>
</html>
